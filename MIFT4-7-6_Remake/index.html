<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冰焰模板4.7.6修改版</title>
    <link rel="icon" href="../icon.png">
    <style>
         :root{
            --maincolor: rgb(35, 40, 171);
        }
    button {
        background-color: var(--maincolor);
        border-radius: 10px;
        border: none;
        color: white;
        padding: 5px 10px;
        text-align: center;
        text-decoration: none;
        display: inline-block;
        font-size: 16px;
        margin: 4px 2px;
        cursor: pointer;
    }
    /* 卡片 */
    .container {
        width: 100%;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
    .box {
        width: 250px;
        height: 200px;
        margin: 20px;
        position: relative;
        display: inline-block;
        box-shadow: 5px 5px 10px 5px lightgray;
        border-radius: 10px;
        transition: 0.2s;
    }
    .box h3{
        color: black;
        margin: 20px;
    }
    .box p{
        color: rgb(141, 141, 141);
        margin: 20px;
        
    }
    .box:hover{
        scale: 0.95;
        box-shadow: 5px 5px 10px 1px lightgray;
    }
    </style>
</head>
<body>
    <h1>冰焰模板4.7.6修改版</h1>
    <a href="../index.html"><button>←返回主页</button></a>
    <h2>模板简介</h2>
    <p>
        本模板是由
        <a href="https://space.bilibili.com/3493128206027407">不玩DL的小丑</a>
        与
        <a href="https://space.bilibili.com/3546927027194565">凛川XR</a>
        共同修改了由
        <a href="https://space.bilibili.com/89919399"d>Max冰焰</a>
        制作的冰焰模板，目前由不玩DL的小丑进行维护。
        <br>我们在模板里面加入了一些官方的元素，比如爱心检查点、皇冠检查点和钻石等；
        与此同时，我们在原模板的基础上，优化了一些脚本的效果，也增加了一些功能。
    </p>
    <h2>模板下载</h2>
    <div class="container">
        <a href="https://github.com/JokerDontPlayDL/MIFT-4-7-6-Remake">
            <div class="box">
                <h3>Github下载</h3>
                <p>
                    Github仓库的更新速度会领先于其他下载方式
                </p>
            </div>
        </a>
    </div>
    <div class="container">
        <a>
            <div class="box">
                <h3>加群下载</h3>
                <p>QQ群的更新速度可能会没有Github快，但是你可以与作者反馈模板的bug以及提供更新建议</p>
            </div>
        </a>
    </div>
</body>
</html>
